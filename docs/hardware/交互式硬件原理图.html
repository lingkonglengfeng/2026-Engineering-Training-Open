<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智能搬运赛项 · 交互式硬件原理图（模块化选型）</title>
<style>
  :root{
    --bg:#0e1319; --panel:#151c26; --line:#2a3542; --txt:#d8e0ea; --sub:#8b98a8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{background:var(--bg); color:var(--txt); font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif; display:flex; flex-direction:column;}

  #topbar{background:var(--panel); border-bottom:1px solid var(--line); padding:8px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; z-index:5;}
  #topbar h1{font-size:16px; font-weight:600; margin-right:6px;}
  #filters{display:flex; gap:8px; margin-left:auto; align-items:center; font-size:12.5px; flex-wrap:wrap;}
  #filters .fbtn{background:#1d2836; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:3px 10px; cursor:pointer; font-size:12.5px;}
  #filters .fbtn.on{border-width:2px;}
  #topbar .btn{background:#1d2836;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12.5px;}

  #main{flex:1; display:flex; min-height:0;}
  #svgwrap{flex:1; position:relative; min-width:0;}
  svg#cv{width:100%; height:100%; display:block; cursor:grab;}
  svg#cv.dragging{cursor:grabbing;}

  .band{fill:#182230; stroke:#2c3a4e;}
  .bandtxt{fill:#7d8fa6; font-size:14px; font-weight:600; letter-spacing:2px;}

  .mod{cursor:pointer;}
  .mod rect.box{rx:10; stroke-width:2.4; fill-opacity:.97;}
  .mod text.t{font-size:17px; font-weight:700; text-anchor:middle; fill:#f4f8fc;}
  .mod text.s{font-size:12.5px; text-anchor:middle; fill:#b6c3d3;}
  .mod.dim{opacity:.38;}
  .mod.sel rect.box{stroke-width:4;}
  .mod.hl rect.box{stroke-width:4;}
  .railtag{font-size:12px; font-weight:700; text-anchor:middle; paint-order:stroke; stroke:#10161f; stroke-width:3px;}

  .stub{cursor:pointer;}
  .stub rect{stroke-width:1;}
  .stub text{font-size:12.5px; fill:#dbe5ef; paint-order:stroke; stroke:#10161f; stroke-width:4px;}

  .net{fill:none; stroke-width:2.1; cursor:pointer; opacity:.92;}
  .net.bus{stroke-width:3;}
  .net.plannet{stroke-dasharray:5 4;}
  .net.hl{stroke-width:3.6; opacity:1;}
  .net.dim{opacity:.1;}
  .netlbl{font-size:13.5px; fill:#c3d0de; paint-order:stroke; stroke:#10161f; stroke-width:4px; text-anchor:middle; cursor:pointer; display:none; font-weight:700;}
  svg.lblmode .netlbl{display:inline;}
  .netlbl.hl{display:inline; fill:#ffd35c;}

  #side{width:410px; background:var(--panel); border-left:1px solid var(--line); padding:14px 16px; overflow-y:auto; flex-shrink:0;}
  #side h2{font-size:17px; margin-bottom:2px;}
  #side .meta{margin:6px 0 10px; display:flex; gap:6px; flex-wrap:wrap;}
  .tag{font-size:11px; padding:1px 8px; border-radius:10px; border:1px solid var(--line); color:var(--sub);}
  .tag.ok{color:#4fc08d;border-color:#4fc08d;}
  .tag.tbd{color:#e0a34d;border-color:#e0a34d;}
  .tag.plan{color:#7d8aa0;border-color:#7d8aa0;}
  #side h3{font-size:13px; color:#4fc3c3; margin:14px 0 4px; letter-spacing:1px;}
  #side ul{padding-left:18px; color:#bcc7d4; font-size:13px;}
  #side li{margin-bottom:4px;}
  #side li b{color:var(--txt);}
  #side table{width:100%; border-collapse:collapse; font-size:12px; color:#bcc7d4;}
  #side td,#side th{border:1px solid var(--line); padding:3px 6px; text-align:left;}
  #side th{color:var(--sub); font-weight:600;}
  #side .hint{color:var(--sub); font-size:12.5px;}
  #side a{color:#5b9bd5; cursor:pointer; text-decoration:underline;}

  #legend{position:absolute; right:12px; bottom:12px; background:#121924ee; border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:12px; color:var(--sub); z-index:4;}
  #legend .row{display:flex; align-items:center; gap:6px; margin:2px 0;}
  #legend .ln{width:22px; height:0; border-top:3px solid; display:inline-block;}
  #legend .ln.dash{border-top-style:dashed;}
  #toast{position:absolute; top:12px; left:50%; transform:translateX(-50%); background:#24405a; border:1px solid #5b9bd5; padding:6px 16px; border-radius:8px; font-size:13px; display:none; z-index:6;}
</style>
</head>
<body>

<div id="topbar">
  <h1>智能搬运 · 硬件原理图（模块化）</h1>

/* 计算模块引脚柱的绝对坐标 */
function stubPos(modId, pinName){
  const m = MMAP[modId];
  if(!m) return null;
  const list = pinName==='CANH' ? (m.pins||[]).filter(p=>p.p==='CANH')
             : m.pins || [];
  /* MCU 的引脚在 left/right/bottom 数组里 */
  if(m.kind==='mcu'){
    const inLeft = m.left.find(p=>p.p===pinName);
    const inRight = m.right.find(p=>p.p===pinName);
    const inBottom = m.bottom.find(p=>p.p===pinName);
    if(inLeft){ const idx = m.left.indexOf(inLeft), n = m.left.length;
      return {x:m.x-m.w/2, y:m.y-m.h/2 + m.h*(idx+0.5)/n, side:'L'}; }
    if(inRight){ const idx = m.right.indexOf(inRight), n = m.right.length;
      return {x:m.x+m.w/2, y:m.y-m.h/2 + m.h*(idx+0.5)/n, side:'R'}; }
    if(inBottom){ const idx = m.bottom.indexOf(inBottom), n = m.bottom.length;
      return {x:m.x-m.w/2 + m.w*(idx+0.5)/n, y:m.y+m.h/2, side:'B'}; }
    return null;
  }
  const pin = (m.pins||[]).find(p=>p.p===pinName);
  if(!pin) return null;
  if(pin.side==='right') return {x:m.x+m.w/2, y:m.y-m.h/2 + m.h*pin.t, side:'R'};
  if(pin.side==='left')  return {x:m.x-m.w/2, y:m.y-m.h/2 + m.h*pin.t, side:'L'};
  if(pin.side==='top')   return {x:m.x-m.w/2 + m.w*pin.t, y:m.y-m.h/2, side:'T'};
  if(pin.side==='bottom')return {x:m.x-m.w/2 + m.w*pin.t, y:m.y+m.h/2, side:'B'};
  return null;
}

        const x1 = a.x + (b.x>a.x ? a.w/2 : -a.w/2);
        const x2 = b.x + (b.x>a.x ? -b.w/2 : b.w/2);
        d = `M${x1},${a.y} L${x2},${b.y}`;
      } else {
        /* 分支供电：从盒底部绕行到目标盒底部（不穿过中间模块） */
        const y1 = a.y + a.h/2, y2 = b.y + b.h/2;
        const droop = Math.max(y1,y2) + 42;
        d = `M${a.x},${y1} C ${a.x},${droop} ${b.x},${droop} ${b.x},${y2}`;
      }
    } else {
      const x1=a.x+a.w/2, x2=b.x+b.w/2;
      d = `M${x1},${a.y+a.h/2} C ${x1},${a.y+a.h/2+40} ${x2},${b.y-40} ${x2},${b.y-b.h/2}`;
    }
    el('path',{d, stroke:col,'stroke-width':3, fill:'none', opacity:.8}, gPower);
  });
  POWER.forEach(p=>{
    const g = el('g',{class:'mod','data-id':p.id}, gPower);
    el('rect',{class:'box', x:p.x-p.w/2, y:p.y-p.h/2, width:p.w, height:p.h, fill:'#1a2331', stroke:RAIL[p.supply]}, g);
    const t = el('text',{class:'t', x:p.x, y:p.y-4}, g); t.textContent=p.name;
    const s = el('text',{class:'s', x:p.x, y:p.y+16}, g); s.textContent=p.sub;
    g.addEventListener('click', ev=>{ev.stopPropagation(); showPower(p.id);});
    p.gEl=g;
  });
  /* 信号网络 */
  gEdges = el('g',{}, gRoot);
  NETS.forEach(n=>drawNet(n));  /* 模块 */
  gMods = el('g',{}, gRoot);
  MODS.forEach(m=>drawMod(m));
  applyVB();
}

function netPathD(a, b){
  if(a.side==='R' && b.side==='L'){
    const dx = Math.max(80, (b.x-a.x)*0.4);
    return `M${a.x},${a.y} C ${a.x+dx},${a.y} ${b.x-dx},${b.y} ${b.x},${b.y}`;
  }
  if(a.side==='L' && b.side==='R'){
    const dx = Math.max(80, (a.x-b.x)*0.4);
    return `M${a.x},${a.y} C ${a.x-dx},${a.y} ${b.x+dx},${b.y} ${b.x},${b.y}`;
  }
  if(a.side==='B' && b.side==='T' && b.y > a.y){
    /* 底边→顶边：先垂直引出再折弯，避免出线口挤成一团 */
    const d1 = 52, d2 = 70;
    return `M${a.x},${a.y} L${a.x},${a.y+d1} C ${a.x},${a.y+d1+d2} ${b.x},${b.y-d1-d2} ${b.x},${b.y-d2} L${b.x},${b.y}`;
  }
  if(a.side==='B' || b.side==='T' || a.side==='T' || b.side==='B'){
    return `M${a.x},${a.y} C ${a.x},${a.y+70} ${b.x},${b.y-70} ${b.x},${b.y}`;
  }
  const mx = (a.x+b.x)/2;
  return `M${a.x},${a.y} C ${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`;
}

function drawNet(n){
  const c = TYPE[n.type];
  const cls = 'net' + (n.bus?' bus':'') + (n.plan?' plannet':'');
  const segs = n.segs || [[n.f, n.t]];
  n.paths = [];
  let first=null, last=null;
  segs.forEach(([fp,tp])=>{
    const a = stubPos(fp.m, fp.p), b = stubPos(tp.m, tp.p);
    if(!a||!b) return;
    if(!first){ first = {a, b}; }
    last = {a, b};
    const path = el('path',{class:cls, d:netPathD(a,b), stroke:c}, gEdges);
    n.paths.push(path);
    [ [a], [b] ].forEach(([p])=>{
      el('rect',{x:p.x-3.5, y:p.y-3.5, width:7, height:7, fill:c, stroke:'#0e1319'}, gEdges);
    });
    path.addEventListener('click', ev=>{ev.stopPropagation(); showNet(n.id);});
    path.addEventListener('mouseenter', ()=>hlNet(n.id));
    path.addEventListener('mouseleave', ()=>hlNet(null));
  });
  if(!first) return;
  /* 网络名标签 */
  if(n.l){
    n.lblEl = el('text',{class:'netlbl', x:(first.a.x+last.b.x)/2, y:(first.a.y+last.b.y)/2-8}, gEdges);
    n.lblEl.textContent = n.l;
    n.lblEl.addEventListener('click', ev=>{ev.stopPropagation(); showNet(n.id);});
  }
}

function drawMod(m){
  const g = el('g',{class:'mod','data-id':m.id}, gMods);
  const border = m.kind==='mcu' ? '#e8eef6' : (TYPE[m.type]||'#5b9bd5');
  const fill = m.kind==='mcu' ? '#2c3d5a' : (m.status==='tbd' ? '#4d3440' : '#25344c');
  el('rect',{class:'box', x:m.x-m.w/2, y:m.y-m.h/2, width:m.w, height:m.h, rx:10, fill, stroke:border,
    'stroke-dasharray': (m.status==='tbd'||m.status==='plan')?'6 4':'none'}, g);
  const t = el('text',{class:'t', x:m.x, y:m.y-(m.sub?10:-4)}, g); t.textContent=m.name;
  if(m.sub){ const s = el('text',{class:'s', x:m.x, y:m.y+12}, g); s.textContent=m.sub; }
  /* 供电角标 */
  if(m.supply && m.supply!=='—'){
    const col = RAIL[m.supply.split('(')[0].trim()] || '#7a8794';
    const tag = el('text',{class:'railtag', x:m.x+m.w/2-24, y:m.y-m.h/2+14, fill:col}, g);
    tag.textContent = m.supply.split('(')[0].trim();
  }
  /* 状态角标 */
  const st = el('text',{class:'railtag', x:m.x-m.w/2+18, y:m.y-m.h/2+14,
    fill: m.status==='ok'?'#4fc08d':(m.status==='tbd'?'#e06c6c':'#7d8aa0')}, g);
  st.textContent = m.status==='ok'?'●':(m.status==='tbd'?'⚑':'○');
  /* 引脚柱与标签 */
  const stubs = [];
  if(m.kind==='mcu'){
    const push=(arr,side)=>arr.forEach(p=>stubs.push({p, side}));
    push(m.left,'L'); push(m.right,'R'); push(m.bottom,'B');
  } else (m.pins||[]).forEach(p=>stubs.push({p:p.p, side:p.side, label:p.l, t:p.t}));
  stubs.forEach(s=>{
    const pos = stubPos(m.id, s.p); if(!pos) return;
    const col = netColorFor(m.id, s.p);
    el('rect',{x:pos.x-3.5, y:pos.y-3.5, width:7, height:7, fill:col, stroke:'#0e1319'}, g);
    let lbl = s.label;
    if(m.kind==='mcu'){
      lbl = s.p;
      if(pos.side==='B'){
        /* 底边引脚名斜排到盒外，避免水平相邻标签重叠 */
        const t2 = el('text',{class:'stub', x:pos.x-2, y:pos.y+18, 'text-anchor':'start',
          transform:`rotate(42 ${pos.x-2} ${pos.y+18})`}, g);
        t2.textContent = lbl;
      } else {
        const t2 = el('text',{class:'stub', x: pos.x + (pos.side==='L'?9:-9), y: pos.y+4,
          'text-anchor': pos.side==='L'?'start':'end'}, g);
        t2.textContent = lbl;
      }
    } else if(s.label){
      const off = pos.side==='T'? -6 : (pos.side==='L'? -8 : 8);
      const anch = pos.side==='T' ? 'middle' : (pos.side==='L'?'end':'start');
      const tx = pos.side==='T'? pos.x : pos.x + off;
      const ty = pos.side==='T'? pos.y-6 : pos.y+3.5;
      const t2 = el('text',{class:'stub', x:tx, y:ty, 'text-anchor':anch}, g);
      t2.textContent = s.label;
    }
    const hit = el('rect',{x:pos.x-14, y:pos.y-8, width:28, height:16, fill:'transparent'}, g);
    hit.addEventListener('click', ev=>{ev.stopPropagation();
      const net = NETS.find(nn => (nn.f.m===m.id&&nn.f.p===s.p)||(nn.t.m===m.id&&nn.t.p===s.p)
        || (nn.drops||[]).some(d=>d.m===m.id&&d.p===s.p));
      if(net) showNet(net.id); else showMod(m.id);
    });
  });
  g.addEventListener('click', ev=>{ev.stopPropagation(); showMod(m.id);});
  m.gEl=g;
}

/* 找某模块某引脚所属网络的颜色 */
function netColorFor(modId, pinName){
  const n = NETS.find(nn => (nn.f.m===modId&&nn.f.p===pinName)||(nn.t.m===modId&&nn.t.p===pinName)
    || (nn.drops||[]).some(d=>d.m===modId&&d.p===pinName));
  return n ? TYPE[n.type] : '#3a4656';
}

/* ---------- 高亮 ---------- */
function hlNet(id){
  NETS.forEach(n=>{
    if(!n.paths) return;
    n.paths.forEach(p=>p.classList.remove('hl','dim'));
    if(n.lblEl) n.lblEl.classList.remove('hl');
    if(id && n.id!==id){ n.paths.forEach(p=>p.classList.add('dim')); }
    if(id && n.id===id){ n.paths.forEach(p=>p.classList.add('hl')); if(n.lblEl) n.lblEl.classList.add('hl'); }
  });
  MODS.forEach(m=>{
    if(!m.gEl) return;
    m.gEl.classList.remove('hl','dim');
    if(id){
      const n = NETS.find(nn=>nn.id===id);
      const involved = n && ((n.f.m===m.id)||(n.t.m===m.id)||(n.drops||[]).some(d=>d.m===m.id));
      if(!involved) m.gEl.classList.add('dim');
    }
  });
}

function headHtml(title, tags){
  return `<h2>${title}</h2><div class="meta">${tags.map(t=>`<span class="tag ${t[1]}">${t[0]}</span>`).join('')}</div>`;
}
function showMod(id){
  selMod=id; selNet=null;
  MODS.forEach(m=>m.gEl&&m.gEl.classList.toggle('sel', m.id===id));
  const m = MMAP[id];
  const stTag = m.status==='ok'?['已定','ok']:m.status==='tbd'?['待冻结','tbd']:['规划','plan'];
  let html = headHtml(m.name, [[m.kind==='mcu'?'主控':(m.type||''),''],stTag,
    ...(m.supply&&m.supply!=='—'?[[m.supply,'ok']]:[])]);
  html += `<div style="color:#bcc7d4">${m.desc||''}</div>`;
  if(m.supply_note) html += `<h3>供电</h3><ul><li>${m.supply_note}</li></ul>`;
  if(m.notes&&m.notes.length) html += `<h3>注意事项</h3><ul>${m.notes.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(m.conns) html += `<h3>连接器建议</h3><ul><li>${m.conns}</li></ul>`;
  /* 相关网络 */
  const nets = NETS.filter(n=>n.f.m===id||n.t.m===id||(n.drops||[]).some(d=>d.m===id));
  if(nets.length){
    html += `<h3>本模块信号（点击查看网络）</h3><table><tr><th>网络</th><th>类型</th><th>对端</th></tr>` +
      nets.map(n=>{
        const other = n.f.m===id ? `${MMAP[n.t.m]?MMAP[n.t.m].name:n.t.m}.${n.t.p}` : `${MMAP[n.f.m].name}.${n.f.p}`;
        return `<tr><td><a data-net="${n.id}">${n.l||n.id}</a></td><td>${n.type}</td><td>${other}</td></tr>`;
      }).join('') + `</table>`;
  }
  /* MCU 引脚全景 */
  if(m.kind==='mcu'){
    const row = (arr)=>arr.map(p=>`<td>${p.p}<br><span style="color:#7d8b9c">${p.l}</span></td>`).join('');
    html += `<h3>引脚全景</h3><table><tr><th>左·通信</th></tr><tr>${row(m.left)}</tr></table>
      <table style="margin-top:6px"><tr><th>右·扩展</th></tr><tr>${row(m.right)}</tr></table>
      <table style="margin-top:6px"><tr><th>底·执行/人机/调试</th></tr><tr>${row(m.bottom)}</tr></table>`;
  }
  side.innerHTML = html;
  side.querySelectorAll('[data-net]').forEach(a=>a.onclick=()=>showNet(a.dataset.net));
}
function showPower(id){
  selMod=null; selNet=null;
  MODS.forEach(m=>m.gEl&&m.gEl.classList.remove('sel'));
  const p = PMAP[id];
  /* 计算下游负载 */
  let html = headHtml(p.name, [[p.supply,'ok'],['电源','']]);
  html += `<div style="color:#bcc7d4">${p.desc}</div>`;
  if(p.notes&&p.notes.length) html += `<h3>注意事项</h3><ul>${p.notes.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  html += `<h3>轨下游负载</h3><ul>${railLoads(p.id)}</ul>`;
  side.innerHTML = html;
}
function railLoads(pid){
  const map = {
    'bus22':['达妙 DM4310（XT30）','张大头35 ×2（XT30）','张大头 X42S ×4（XT30）'],
    'dcdc12':['LED 补光灯'],
    'dcdc6':['抓取舵机 DS3218','转盘舵机 360°'],
    'dcdc5':['MaxiCAM #1','MaxiCAM #2','陶晶驰串口屏'],
    'ldo':['STM32H723 主控','IPS200 屏 + BLK','HWT101（按铭牌）','W25Q64','I2C 4.7kΩ 上拉'],
    'fuse':['下级所有电源模块（见电源树）'],
    'sw':['下级所有电源模块（见电源树）'],
  };
  const list = map[pid] || [];
  return list.length? list.map(x=>`<li>${x}</li>`).join('') : '<li style="list-style:none;color:#7d8b9c">见模块说明</li>';
}
function showNet(id){
  selNet=id; selMod=null;
  MODS.forEach(m=>m.gEl&&m.gEl.classList.remove('sel'));
  hlNet(id);
  const n = NETS.find(x=>x.id===id);
  const fm = MMAP[n.f.m], tm = MMAP[n.t.m];
  let html = headHtml(n.l||n.id, [[n.type,''],[n.plan?'规划':'已接',n.plan?'plan':'ok']]);
  html += `<table><tr><th></th><th>模块</th><th>引脚</th></tr>
    <tr><td>起点</td><td>${fm.name}</td><td>${n.f.p}${fm.kind==='mcu'?'（'+(fm.left.concat(fm.right,fm.bottom).find(p=>p.p===n.f.p)||{l:''}).l+'）':''}</td></tr>
    <tr><td>终点</td><td>${tm.name}</td><td>${n.t.p}</td></tr></table>`;
  if(n.drops){
    html += `<h3>总线下挂节点</h3><ul>${n.drops.map(d=>`<li>${MMAP[d.m].name} · ${d.p}</li>`).join('')}</ul>`;
  }
  /* 该类型走线共性 */
  const tips = {
    CAN:['H/L 双绞，节点手拉手；<b>仅总线末端闭合 120Ω 一处</b>','共地；远离电机动力线，避免平行长距离走线'],
    UART:['交叉连接 TX→RX','共地；外部模块若为 5V TTL 必须加电平转换模块'],
    SPI:['每从设备独立 CS#，空闲高电平','MISO 仅双向器件需要'],
    I2C:['开漏总线必须外接上拉（4.7kΩ→3.3V）'],
    PWM:['50Hz / 500~2500µs；信号线用浅色（橙白）线便于识别'],
    KEY:['MCU 内部上拉，开关另一端接 GND，低电平有效'],
    LED:['低电平点亮，串 330Ω'],
    SWD:['4P：3.3V/GND/SWDIO/SWCLK；NRST 可选'],
  };
  if(tips[n.type]) html += `<h3>走线要点</h3><ul>${tips[n.type].map(t=>`<li>${t}</li>`).join('')}</ul>`;
  side.innerHTML = html;
}

/* ---------- 类型过滤 ---------- */
const fbox = document.getElementById('filters');
TYPEFILTERS.forEach(([tid,name])=>{
  const b = document.createElement('button');
  b.className = 'fbtn' + (tid==='ALL'?' on':'');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  setTimeout(()=>t.style.display='none', 1600);
}

/* ---------- 平移缩放 ---------- */
function svgPoint(ev){
  const r = svg.getBoundingClientRect();
  return { x: vb.x + (ev.clientX-r.left)/r.width*vb.w,
           y: vb.y + (ev.clientY-r.top)/r.height*vb.h };
}
svg.addEventListener('mousedown', ev=>{
  if(ev.target.closest('.mod')||ev.target.closest('.net')||ev.target.closest('.stub')) return;
  const start = {px:ev.clientX, py:ev.clientY, vx:vb.x, vy:vb.y};
  svg.classList.add('dragging');
  const mv = e=>{
    const r = svg.getBoundingClientRect();
    vb.x = start.vx - (e.clientX-start.px)*vb.w/r.width;
    vb.y = start.vy - (e.clientY-start.py)*vb.h/r.height;
    applyVB();
  };
  const up = ()=>{ svg.classList.remove('dragging'); window.removeEventListener('mousemove',mv); window.removeEventListener('mouseup',up); };
  window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
});
svg.addEventListener('wheel', ev=>{
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = vb.x + (ev.clientX-r.left)/r.width*vb.w;
  const my = vb.y + (ev.clientY-r.top)/r.height*vb.h;
  const k = ev.deltaY>0 ? 1.12 : 1/1.12;
  const nw = Math.min(Math.max(vb.w*k, 300), 4600);
  const s = nw/vb.w;
  vb.x = mx-(mx-vb.x)*s; vb.y = my-(my-vb.y)*s; vb.w=nw; vb.h=vb.h*s;
  applyVB();
},{passive:false});
svg.addEventListener('click', ev=>{
  if(!ev.target.closest('.mod') && !ev.target.closest('.net') && !ev.target.closest('.stub')){ resetSide(); hlNet(null); }
});
document.getElementById('resetView').onclick = ()=>{ vb={x:380,y:330,w:1500,h:1125}; applyVB(); resetSide(); hlNet(null); };
