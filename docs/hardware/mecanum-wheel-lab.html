:root[data-theme=&quot;light&quot;] {

    light-dark(rgb(255 255 255), rgb(24 24 24))

}

}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;mecanum-lab&quot;&gt;
&lt;style&gt;
#mecanum-lab{--ml-bg:#0b1118;--ml-panel:#121b25;--ml-panel2:#172434;--ml-line:#2b3d52;--ml-text:#e9f1f8;--ml-muted:#91a4b7;--ml-cyan:#52d5ff;--ml-green:#5ee58f;--ml-amber:#ffc35c;--ml-pink:#ff6fae;--ml-red:#ff6472;color-scheme:dark;background:radial-gradient(circle at 15% 0%,#173354 0,var(--ml-bg) 38%);color:var(--ml-text);font-family:Inter,&quot;Segoe UI&quot;,&quot;Microsoft YaHei&quot;,sans-serif;border-radius:18px;padding:18px;box-sizing:border-box;width:100%;overflow:hidden}
#mecanum-lab *{box-sizing:border-box}
#mecanum-lab .ml-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:14px}
#mecanum-lab h2{margin:0;font-size:22px;letter-spacing:.02em}
#mecanum-lab .ml-sub{margin:4px 0 0;color:var(--ml-muted);font-size:13px}
#mecanum-lab .ml-status{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#mecanum-lab .ml-chip{border:1px solid var(--ml-line);background:rgba(255,255,255,.04);border-radius:999px;padding:7px 10px;font-size:12px;color:var(--ml-muted);white-space:nowrap}
#mecanum-lab .ml-chip b{color:var(--ml-text)}
#mecanum-lab .ml-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,.85fr);gap:14px;align-items:stretch}
#mecanum-lab .ml-card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)),var(--ml-panel);border:1px solid var(--ml-line);border-radius:14px;box-shadow:0 16px 36px rgba(0,0,0,.2)}
#mecanum-lab .ml-stage-wrap{padding:10px;min-height:420px}
#mecanum-lab svg{display:block;width:100%;height:auto;min-height:390px;border-radius:10px;background:#0d1620;touch-action:none;user-select:none}
#mecanum-lab .ml-wheel{cursor:grab}
#mecanum-lab .ml-wheel:active{cursor:grabbing}
#mecanum-lab .ml-wheel-body{fill:#26364a;stroke:#8ea9c4;stroke-width:2}
#mecanum-lab .ml-roller{stroke:#a8bacd;stroke-width:2;stroke-linecap:round;opacity:.75}
#mecanum-lab .ml-wheel-label{font-size:13px;font-weight:700;fill:#f8fbff;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
#mecanum-lab .ml-wheel-name{font-size:10px;fill:#cfe0ef;text-anchor:middle;pointer-events:none}
#mecanum-lab .ml-rpm{font-size:11px;font-weight:700;text-anchor:middle;pointer-events:none}
#mecanum-lab .ml-wheel.selected .ml-wheel-body{stroke:var(--ml-cyan);stroke-width:3}
#mecanum-lab .ml-controls{padding:14px;display:flex;flex-direction:column;gap:12px}
#mecanum-lab .ml-section-title{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ml-muted);margin:0}
#mecanum-lab .ml-btn-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
#mecanum-lab button{border:1px solid var(--ml-line);background:#1b2a3b;color:var(--ml-text);border-radius:9px;padding:9px 8px;font:inherit;font-size:13px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
#mecanum-lab button:hover{border-color:#58748f;background:#22364b}
#mecanum-lab button:active{transform:translateY(1px)}
#mecanum-lab button.active{border-color:var(--ml-cyan);background:#17394d;color:#dff8ff}
#mecanum-lab button.danger{border-color:#7c2d39;background:#3a1d25}
#mecanum-lab .ml-slider{margin:0}
#mecanum-lab .ml-slider-head{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px}
#mecanum-lab .ml-slider-head output{font-variant-numeric:tabular-nums;color:var(--ml-cyan);font-weight:700}
#mecanum-lab input[type=range]{width:100%;accent-color:var(--ml-cyan)}
#mecanum-lab .ml-readout{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#mecanum-lab .ml-stat{background:var(--ml-panel2);border:1px solid #22364a;border-radius:10px;padding:9px}
#mecanum-lab .ml-stat span{display:block;color:var(--ml-muted);font-size:11px;margin-bottom:3px}
#mecanum-lab .ml-stat b{font-size:15px;font-variant-numeric:tabular-nums}
#mecanum-lab .ml-wheel-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
#mecanum-lab .ml-wheel-card{padding:11px;display:grid;gap:8px}
#mecanum-lab .ml-wheel-card-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
#mecanum-lab .ml-wheel-card-head strong{font-size:14px}
#mecanum-lab .ml-addr{color:var(--ml-muted);font-size:12px}
#mecanum-lab .ml-mini-row{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;font-size:12px;color:var(--ml-muted)}
#mecanum-lab .ml-mini-row input[type=number]{width:100%;min-width:0;border:1px solid var(--ml-line);background:#0f1924;color:var(--ml-text);border-radius:7px;padding:5px 6px;font:inherit}
#mecanum-lab .ml-toggle-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#mecanum-lab .ml-toggle-row button{padding:6px;font-size:12px}
#mecanum-lab .ml-legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 4px 0;color:var(--ml-muted);font-size:12px}
#mecanum-lab .ml-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#mecanum-lab .ml-note{color:var(--ml-muted);font-size:11px;line-height:1.45}
#mecanum-lab .ml-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:860px){#mecanum-lab .ml-grid{grid-template-columns:1fr}#mecanum-lab .ml-wheel-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){#mecanum-lab{padding:11px}#mecanum-lab .ml-head{display:block}#mecanum-lab .ml-status{justify-content:flex-start;margin-top:10px}#mecanum-lab .ml-wheel-list{grid-template-columns:1fr}#mecanum-lab svg{min-height:310px}}

&lt;div class=&quot;ml-head&quot;&gt;
  &lt;div&gt;&lt;h2&gt;麦轮运动沙盘&lt;/h2&gt;&lt;p class=&quot;ml-sub&quot;&gt;拖动四个轮子布置位置，调节运动速度，观察各轮转速和车体运动方向。&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ml-status&quot;&gt;&lt;span class=&quot;ml-chip&quot;&gt;安装 &lt;b id=&quot;ml-layout-chip&quot;&gt;O-长方形&lt;/b&gt;&lt;/span&gt;&lt;span class=&quot;ml-chip&quot;&gt;模式 &lt;b id=&quot;ml-mode-label&quot;&gt;平移模式&lt;/b&gt;&lt;/span&gt;&lt;span class=&quot;ml-chip&quot;&gt;轮速上限 &lt;b id=&quot;ml-max-chip&quot;&gt;80 RPM&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ml-grid&quot;&gt;
  &lt;section class=&quot;ml-card ml-stage-wrap&quot; aria-label=&quot;麦轮布置和运动方向预览&quot;&gt;
    &lt;svg id=&quot;ml-stage&quot; viewBox=&quot;0 0 900 560&quot; role=&quot;img&quot; aria-labelledby=&quot;ml-svg-title ml-svg-desc&quot;&gt;
      &lt;title id=&quot;ml-svg-title&quot;&gt;四轮麦轮底盘布置与运动方向预览&lt;/title&gt;&lt;desc id=&quot;ml-svg-desc&quot;&gt;拖动轮组改变位置，箭头表示车体平移方向，环形箭头表示旋转方向。&lt;/desc&gt;
      &lt;defs&gt;
        &lt;pattern id=&quot;ml-grid&quot; width=&quot;30&quot; height=&quot;30&quot; patternUnits=&quot;userSpaceOnUse&quot;&gt;&lt;path d=&quot;M 30 0 L 0 0 0 30&quot; fill=&quot;none&quot; stroke=&quot;#1c2b3c&quot; stroke-width=&quot;1&quot;/&gt;&lt;/pattern&gt;
        &lt;marker id=&quot;ml-arrow&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0 0 L10 5 L0 10 z&quot; fill=&quot;#52d5ff&quot;/&gt;&lt;/marker&gt;
        &lt;marker id=&quot;ml-omega-arrow&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0 L10 5 L0 10 z&quot; fill=&quot;#ffc35c&quot;/&gt;&lt;/marker&gt;
        &lt;filter id=&quot;ml-glow&quot;&gt;&lt;feGaussianBlur stdDeviation=&quot;4&quot; result=&quot;b&quot;/&gt;&lt;feMerge&gt;&lt;feMergeNode in=&quot;b&quot;/&gt;&lt;feMergeNode in=&quot;SourceGraphic&quot;/&gt;&lt;/feMerge&gt;&lt;/filter&gt;
      &lt;/defs&gt;
      &lt;rect width=&quot;900&quot; height=&quot;560&quot; fill=&quot;url(#ml-grid)&quot;/&gt;
      &lt;rect x=&quot;310&quot; y=&quot;95&quot; width=&quot;280&quot; height=&quot;370&quot; rx=&quot;26&quot; fill=&quot;#111e2b&quot; stroke=&quot;#3e566f&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;path d=&quot;M 450 75 L 420 106 L 480 106 Z&quot; fill=&quot;#52d5ff&quot; opacity=&quot;.85&quot;/&gt;
      &lt;text x=&quot;450&quot; y=&quot;65&quot; fill=&quot;#91a4b7&quot; font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;前方&lt;/text&gt;
      &lt;g id=&quot;ml-omega-guide&quot; opacity=&quot;0&quot;&gt;&lt;path id=&quot;ml-omega-path&quot; d=&quot;M 450 180 A 100 100 0 1 1 450 380&quot; fill=&quot;none&quot; stroke=&quot;#ffc35c&quot; stroke-width=&quot;5&quot; stroke-linecap=&quot;round&quot; marker-end=&quot;url(#ml-omega-arrow)&quot;/&gt;&lt;text x=&quot;560&quot; y=&quot;290&quot; fill=&quot;#ffc35c&quot; font-size=&quot;13&quot; id=&quot;ml-omega-text&quot;&gt;ω&lt;/text&gt;&lt;/g&gt;
      &lt;line id=&quot;ml-vector&quot; x1=&quot;450&quot; y1=&quot;280&quot; x2=&quot;450&quot; y2=&quot;280&quot; stroke=&quot;#52d5ff&quot; stroke-width=&quot;7&quot; stroke-linecap=&quot;round&quot; marker-end=&quot;url(#ml-arrow)&quot; filter=&quot;url(#ml-glow)&quot; opacity=&quot;0&quot;/&gt;
      &lt;circle cx=&quot;450&quot; cy=&quot;280&quot; r=&quot;8&quot; fill=&quot;#0b1118&quot; stroke=&quot;#52d5ff&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;g id=&quot;ml-wheels&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;ml-legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#5ee58f&quot;&gt;&lt;/i&gt;正转&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#ff6472&quot;&gt;&lt;/i&gt;反转&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#52d5ff&quot;&gt;&lt;/i&gt;平移方向&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#ffc35c&quot;&gt;&lt;/i&gt;旋转方向&lt;/span&gt;&lt;span&gt;左右轮滚子镜像&lt;/span&gt;&lt;span&gt;拖动轮组可改变位置&lt;/span&gt;&lt;/div&gt;
  &lt;/section&gt;
  &lt;aside class=&quot;ml-card ml-controls&quot; aria-label=&quot;运动控制&quot;&gt;
    &lt;p class=&quot;ml-section-title&quot;&gt;安装形式&lt;/p&gt;
    &lt;div class=&quot;ml-btn-row&quot;&gt;&lt;button type=&quot;button&quot; data-layout=&quot;O&quot; class=&quot;active&quot;&gt;O-长方形&lt;/button&gt;&lt;button type=&quot;button&quot; data-layout=&quot;X&quot;&gt;X-长方形&lt;/button&gt;&lt;/div&gt;
    &lt;p class=&quot;ml-section-title&quot;&gt;运动模式&lt;/p&gt;
    &lt;div class=&quot;ml-btn-row&quot;&gt;&lt;button type=&quot;button&quot; data-mode=&quot;translate&quot; class=&quot;active&quot;&gt;平移模式&lt;/button&gt;&lt;button type=&quot;button&quot; data-mode=&quot;turn&quot;&gt;转向模式&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;ml-reset&quot;&gt;复位布局&lt;/button&gt;&lt;/div&gt;
    &lt;p class=&quot;ml-section-title&quot;&gt;方向键&lt;/p&gt;
